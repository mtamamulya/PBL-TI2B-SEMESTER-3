    DosenCreateInput:
      type: object
      required: [nama_lengkap, nip, status_dosen, email, role, password, pangkat, golongan, nomor_sk, tanggal_sk]
      properties:
        nama_lengkap:
          type: string
          maxLength: 100
          example: Budi Santoso, S.Kom., M.Cs.
        nip:
          type: string
          pattern: '^\d{8,20}$'
          example: '199005122022031004'
        status_dosen:
          type: string
          enum: [aktif, nonaktif]
          example: aktif
        email:
          type: string
          format: email
          maxLength: 150
          example: budi.santoso@polines.ac.id
        role:
          type: string
          enum: [dosen, admin, kaprodi]
          example: dosen
        password:
          type: string
          format: password
          minLength: 8
          example: password123
        foto:
          type: string
          format: binary
          description: Foto profil JPG, PNG, atau WebP maksimal 2 MB (opsional).
        pangkat:
          type: string
          example: Asisten Ahli
        golongan:
          type: string
          example: III/b
        nomor_sk:
          type: string
          maxLength: 100
          example: 0123/PL4.7.2/KP/2026
        tanggal_sk:
          type: string
          format: date
          example: '2026-11-16'

    DosenUpdateInput:
      type: object
      required: [nama_lengkap, nip, email]
      properties:
        nama_lengkap:
          type: string
          maxLength: 100
          example: Kuwat Santoso, S.T., M.Kom.
        nip:
          type: string
          pattern: '^\d{8,20}$'
          example: '198407192019031008'
        status_dosen:
          type: string
          enum: [aktif, nonaktif]
          description: Wajib untuk admin; diabaikan bila diubah oleh dosen pemilik profil.
          example: aktif
        email:
          type: string
          format: email
          maxLength: 150
          example: kuwatsantoso@polines.ac.id
        role:
          type: string
          enum: [dosen, admin, kaprodi]
          description: Wajib untuk admin; diabaikan bila diubah oleh dosen pemilik profil.
          example: dosen
        status_akun:
          type: string
          enum: [aktif, nonaktif]
          description: Wajib untuk admin; diabaikan bila diubah oleh dosen pemilik profil.
          example: aktif
        password:
          type: string
          format: password
          minLength: 8
          nullable: true
          description: Kosongkan jika tidak ingin mengubah password.
        foto:
          type: string
          format: binary
          description: Foto profil baru JPG, PNG, atau WebP maksimal 2 MB (opsional).
        pangkat:
          type: string
          nullable: true
          description: Wajib diisi bersama `golongan`, `nomor_sk`, dan `tanggal_sk` jika menambah riwayat pangkat baru.
