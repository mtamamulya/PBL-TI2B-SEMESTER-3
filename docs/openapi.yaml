  /admin/kegiatan/ringkasan:
    get:
      tags: [Kegiatan Admin Kel1]
      summary: Ringkasan jumlah kegiatan (kartu tab)
      description: Peran **admin** atau **kaprodi**. Hanya kegiatan dengan status terkini `diterima`.
