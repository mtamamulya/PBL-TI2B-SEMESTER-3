        '401':
          $ref: '#/components/responses/TidakLogin'
        '403':
          $ref: '#/components/responses/DilarangPeran'
        '404':
          $ref: '#/components/responses/TidakDitemukan'
    delete:
      tags: [Kegiatan Admin Kel1]
      summary: Hapus kegiatan
      description: Khusus peran **admin** (kaprodi mendapat 403). Gagal 409 bila masih dipakai data lain.
