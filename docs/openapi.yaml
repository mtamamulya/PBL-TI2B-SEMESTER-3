        - bearerAuth: []
      responses:
        '200':
          description: Jumlah per tab, daftar tahun, dan daftar kategori.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KegiatanAdminRingkasanResponse'
        '401':
          $ref: '#/components/responses/TidakLogin'
        '403':
          $ref: '#/components/responses/DilarangPeran'

  /admin/kegiatan:
    get:
      tags: [Kegiatan Admin Kel1]
      summary: Daftar Data Kegiatan (berhalaman)
      description: |
        Peran **admin** atau **kaprodi**. Hanya kegiatan berstatus terkini `diterima`.
        Tab ditentukan dari peran akun pembuat kegiatan (prodi = admin/kaprodi, dosen, mahasiswa).
        Bawaan 100 per halaman, maksimal 200.
      security:
        - bearerAuth: []
      parameters:
        - name: jenis
          in: query
          description: Tab yang dipilih. Kosong = semua.
          schema:
            type: string
            enum: [prodi, dosen, mahasiswa]
        - name: id_kategori
          in: query
          schema:
            type: integer
        - name: q
          in: query
          description: Cari pada nama kegiatan atau pengaju.
          schema:
            type: string
            maxLength: 100
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Daftar kegiatan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KegiatanAdminListResponse'
        '401':
          $ref: '#/components/responses/TidakLogin'
        '403':
          $ref: '#/components/responses/DilarangPeran'
        '422':
          $ref: '#/components/responses/ValidasiGagal'
    post:
      tags: [Kegiatan Admin Kel1]
      summary: Tambah kegiatan (langsung berstatus diterima)
      description: |
        Peran **admin** atau **kaprodi**. Dikirim sebagai multipart/form-data.
        Karena multipart tidak mendukung larik bersarang, kirim dengan kunci kurung siku:
        `anggota[0]=dosen:5`, `dokumen[0][nama]`, `dokumen[0][file]`.
        Pemilik kegiatan: Kegiatan Prodi = akun pembuat; Kegiatan Dosen = dosen pertama di `anggota`;
        Kegiatan Mahasiswa = mahasiswa pertama di `anggota` (422 bila tidak ada).
        Isian `penyelenggara`, `tanggal_mulai`, `tanggal_selesai` yang tidak dimiliki kategorinya
        dilewati dan dilaporkan di `peringatan`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/KegiatanAdminInput'
      responses:
        '201':
          description: Kegiatan dibuat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KegiatanAdminDetailResponse'
        '401':
          $ref: '#/components/responses/TidakLogin'
        '403':
          $ref: '#/components/responses/DilarangPeran'
        '422':
          $ref: '#/components/responses/ValidasiGagal'

