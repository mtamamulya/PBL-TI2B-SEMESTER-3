        '403':
          $ref: '#/components/responses/DilarangPeran'
        '422':
          $ref: '#/components/responses/ValidasiGagal'
    post:
      tags: [Admin Prestasi]
      summary: Tambah prestasi sebagai Admin
      description: |
        Menambahkan prestasi mandiri atau dari kegiatan yang status terkininya diterima.
        Jika sumber sebelumnya, pemilik harus pengaju atau anggota kegiatan tersebut.
        Data yang tersedia pada kegiatan asal diterapkan ulang di sisi server.
        Prestasi mandiri berbentuk Tim wajib memiliki minimal dua anggota, tepat satu Ketua,
        dan pemilik prestasi harus tercantum sebagai anggota.
        Wajib ada setidaknya satu tautan bukti yang valid; maksimal lima.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPrestasiRequest'
      responses:
        '201':
          description: Prestasi berhasil ditambahkan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPrestasiActionResponse'
        '401':
          $ref: '#/components/responses/TidakLogin'
        '403':
          $ref: '#/components/responses/DilarangPeran'
        '422':
          $ref: '#/components/responses/ValidasiGagal'

  /admin/prestasi/rekap:
    get:
      tags: [Admin Prestasi]
      summary: Rekap prestasi untuk daftar kaprodi dan laporan PDF/Excel (berhalaman)
      description: |
        Peran **admin** atau **kaprodi**. Baris sudah matang (nama, kategori, pemilik, tipe, tingkat, capaian,
        tanggal, tahun, semester). Tahun dan semester mengikuti tanggal selesai (Ganjil bila bulan 9-2, Genap bila 3-8).
        Bawaan 100 per halaman, maksimal 200.
      security:
        - bearerAuth: []
      parameters:
        - name: jenis
          in: query
          description: Saring tipe pemilik prestasi. Kosong = semua.
          schema:
            type: string
            enum: [dosen, mahasiswa]
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Rekap prestasi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        nama: {type: string}
                        kategori: {type: string}
                        pemilik_prestasi: {type: string}
                        tipe: {type: string, enum: [Dosen, Mahasiswa, '-']}
                        tingkat: {type: string}
                        capaian: {type: string}
                        tanggal: {type: string, example: 17 September 2026}
                        raw_date: {type: string, nullable: true, example: '2026-09-17'}
                        tahun: {type: integer, nullable: true}
                        semester: {type: string, example: Ganjil}
                  meta:
                    type: object
                    properties:
                      current_page: {type: integer}
                      last_page: {type: integer}
                      per_page: {type: integer}
                      total: {type: integer}
        '401':
          $ref: '#/components/responses/TidakLogin'
        '403':
          $ref: '#/components/responses/DilarangPeran'
        '422':
          $ref: '#/components/responses/ValidasiGagal'
  /admin/prestasi/opsi:
    get:
      tags: [Admin Prestasi]
      summary: Pilihan untuk formulir Admin Prestasi
      description: |
        Daftar kegiatan berstatus diterima, pemilik yang berperan dosen/mahasiswa,
        kandidat anggota tim, pilihan tingkat, capaian, jenis, dan jenis dokumen.
        Dapat dipanggil sebelum menampilkan form tambah atau edit.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Opsi formulir berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPrestasiOpsiResponse'
        '401':
          $ref: '#/components/responses/TidakLogin'
        '403':
          $ref: '#/components/responses/DilarangPeran'

  /admin/prestasi/{id}:
    get:
      tags: [Admin Prestasi]
      summary: Detail prestasi untuk Admin
      description: |
        Mengambil atribut, relasi, dan objek tampilan untuk halaman detail dan edit Admin.
        Objek tampilan menggunakan kunci yang digunakan Blade Admin Prestasi.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Detail prestasi berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPrestasiDetailResponse'
        '401':
          $ref: '#/components/responses/TidakLogin'
        '403':
          $ref: '#/components/responses/DilarangPeran'
        '404':
          $ref: '#/components/responses/TidakDitemukan'
    put:
      tags: [Admin Prestasi]
      summary: Perbarui prestasi sebagai Admin
      description: |
        Memvalidasi ulang seluruh data prestasi. Gunakan dokumen_pertahankan berisi ID bukti
        lama yang masih dipakai. Bukti lama yang tidak termasuk daftar tersebut dihapus.
        Bukti baru dikirim melalui dokumen. Sumber kegiatan dan aturan anggota tim diperiksa
        lagi di server. Kegiatan asalnya tidak diubah.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPrestasiRequest'
      responses:
        '200':
          description: Prestasi berhasil diperbarui.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPrestasiActionResponse'
        '401':
          $ref: '#/components/responses/TidakLogin'
        '403':
          $ref: '#/components/responses/DilarangPeran'
        '404':
          description: ID prestasi tidak ditemukan (respons ditangani handler Laravel).
        '422':
          $ref: '#/components/responses/ValidasiGagal'
    delete:
      tags: [Admin Prestasi]
      summary: Hapus prestasi sebagai Admin
      description: |
        Menghapus prestasi dan bukti yang terkait. Kegiatan asal tidak dihapus.
        Berkas lokal dengan prefix bukti-prestasi/ juga dibersihkan bila ada.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Prestasi berhasil dihapus.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPrestasiActionResponse'
        '401':
          $ref: '#/components/responses/TidakLogin'
        '403':
          $ref: '#/components/responses/DilarangPeran'
        '404':
          description: ID prestasi tidak ditemukan (respons ditangani handler Laravel).

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token dari POST /login. Tempel tokennya saja, tanpa kata "Bearer".

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: ID data (angka).
      schema:
        type: integer
        minimum: 1
    PerPage:
      name: per_page
      in: query
      description: Jumlah data per halaman (bawaan 15).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
    Angkatan:
      name: angkatan
      in: query
      description: |
        Angkatan (tahun masuk mahasiswa, 4 digit). Memilih kurikulum yang berlaku bagi angkatan itu:
        kurikulum dengan tahun mulai terbesar yang masih kurang dari atau sama dengan angkatan.
        Angkatan yang belum punya kurikulum menghasilkan daftar kosong (200, bukan galat).
        Pada `/mata-kuliah` tidak boleh dikirim bersama `id_kurikulum` (422).
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
        example: 2024
    Page:
      name: page
      in: query
      description: Nomor halaman.
      schema:
        type: integer
        minimum: 1
        default: 1

  responses:
    TidakLogin:
      description: Belum login atau token tidak valid/kedaluwarsa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GalatUmum'
          example:
            success: false
            message: Belum login atau token tidak valid.
    DilarangPeran:
      description: Peran akun tidak diizinkan untuk aksi ini.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GalatUmum'
          example:
            success: false
            message: Anda tidak memiliki izin untuk mengakses fitur ini.
    TidakDitemukan:
      description: Data tidak ditemukan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GalatUmum'
          example:
            success: false
            message: Data tidak ditemukan.
    ValidasiGagal:
      description: Input tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GalatValidasi'
    TerlaluBanyak:
      description: Terlalu banyak permintaan. Coba lagi beberapa saat lagi.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GalatUmum'
    DosenTidakDitemukan:
      description: Data dosen tidak ditemukan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GalatUmum'
          example:
            success: false
            message: Data dosen tidak ditemukan.
    DosenDilarang:
      description: Peran akun tidak diizinkan atau bukan pemilik profil dosen.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GalatUmum'
          example:
            success: false
            message: Anda tidak memiliki izin untuk mengubah data dosen ini.
    DosenValidasiGagal:
      description: Input data dosen tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GalatValidasi'
          example:
            success: false
            message: Data yang dikirim tidak valid. Periksa kembali isian Anda.
            errors:
              nip:
                - NIP sudah dipakai dosen lain.
              email:
                - Email sudah dipakai akun lain.
    MahasiswaTidakDitemukan:
      description: Data mahasiswa tidak ditemukan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GalatUmum'
          example:
            success: false
            message: Data mahasiswa tidak ditemukan.
    MahasiswaDilarang:
      description: Peran akun tidak diizinkan atau bukan pemilik profil mahasiswa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GalatUmum'
          example:
            success: false
            message: Anda tidak memiliki izin untuk mengubah data mahasiswa ini.
    MahasiswaValidasiGagal:
      description: Input data mahasiswa tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GalatValidasi'
          example:
            success: false
            message: Data yang dikirim tidak valid. Periksa kembali isian Anda.
            errors:
              nim:
                - Tahun pada NIM (2025) tidak sama dengan angkatan (2024).
              email:
                - Email sudah dipakai akun lain.

  schemas:

    KegiatanAdminBaris:
      type: object
      properties:
        id: {type: string, example: '12'}
        jenis: {type: string, enum: [prodi, dosen, mahasiswa]}
        nama: {type: string, example: Pelatihan Keamanan Siber}
        id_kategori: {type: integer}
        kategori: {type: string}
        pengaju: {type: string, description: Email akun pembuat untuk prodi; nama dosen/mahasiswa untuk lainnya.}
        tanggal: {type: string, example: 5 Maret 2026}
        raw_date: {type: string, nullable: true, example: '2026-03-05'}
        tahun: {type: integer, nullable: true}
        status: {type: string, example: Disetujui}
        semester: {type: string, enum: [Ganjil, Genap]}
        tingkat: {type: integer, nullable: true}
        kelas: {type: string}

    KegiatanAdminDetail:
      allOf:
        - $ref: '#/components/schemas/KegiatanAdminBaris'
        - type: object
          properties:
            nomor_sk: {type: string, nullable: true}
            tanggal_sk: {type: string, nullable: true}
            isian:
              type: array
              items:
                type: object
                properties:
                  input: {type: string}
                  isian: {type: string}
            anggota:
              type: array
              items:
                type: object
                properties:
                  id_user: {type: integer}
                  nama: {type: string}
                  tipe: {type: string, enum: [dosen, mahasiswa]}
                  peran: {type: string, enum: [ketua, anggota]}
                  status: {type: string}
                  pengaju: {type: boolean}
            dokumen:
              type: array
              items:
                type: object
                properties:
                  id: {type: integer}
                  nama: {type: string}
                  kategori: {type: string}
                  tipe: {type: string}
                  lampiran: {type: boolean}
                  url: {type: string, nullable: true}
            riwayat:
              type: array
              items:
                type: object
                properties:
                  status: {type: string}
                  tanggal: {type: string}
                  keterangan: {type: string, nullable: true}

    KegiatanAdminDetailResponse:
      type: object
      properties:
        success: {type: boolean, example: true}
        message: {type: string}
        data:
          $ref: '#/components/schemas/KegiatanAdminDetail'
        peringatan:
          type: array
          description: Hanya pada POST; isian yang dilewati karena tidak ada di kategori.
          items: {type: string}

    KegiatanAdminListResponse:
      type: object
      properties:
        success: {type: boolean, example: true}
        message: {type: string}
        data:
          type: array
          items:
            $ref: '#/components/schemas/KegiatanAdminBaris'
        meta:
          type: object
          properties:
            current_page: {type: integer}
            last_page: {type: integer}
            per_page: {type: integer}
            total: {type: integer}

    KegiatanAdminRingkasanResponse:
      type: object
      properties:
        success: {type: boolean, example: true}
        message: {type: string}
        data:
          type: object
          properties:
            jumlah:
              type: object
              properties:
                semua: {type: integer}
                prodi: {type: integer}
                dosen: {type: integer}
                mahasiswa: {type: integer}
            tahun:
              type: array
              items: {type: integer}
            kategori:
              type: array
              items:
                type: object

    KegiatanAdminInput:
      type: object
      required: [jenis_kegiatan, nama_kegiatan, penyelenggara, tanggal_mulai, tanggal_selesai, anggota]
      properties:
        jenis_kegiatan:
          type: string
          enum: [Kegiatan Prodi, Kegiatan Dosen, Kegiatan Mahasiswa]
        id_kategori: {type: integer, description: Isi salah satu dari id_kategori atau kategori.}
        kategori: {type: string, description: Nama kategori.}
        nama_kegiatan: {type: string}
        penyelenggara: {type: string}
        tanggal_mulai: {type: string, format: date}
        tanggal_selesai: {type: string, format: date}
        anggota:
          type: array
          minItems: 1
          description: 'Bentuk `dosen:ID` atau `mahasiswa:ID`; kirim sebagai anggota[0], anggota[1], dst.'
          items: {type: string, example: 'dosen:5'}
        dokumen:
          type: array
          description: 'Kirim sebagai dokumen[0][nama], dokumen[0][file], dokumen[0][jenis] atau [id_jenis_dokumen], [keterangan], [tautan].'
          items:
            type: object
            properties:
              nama: {type: string}
              file: {type: string, format: binary}
              jenis: {type: string}
              id_jenis_dokumen: {type: integer}
              keterangan: {type: string}
              tautan: {type: string}

    AdminPrestasiTampilan:
      type: object
      description: Objek siap tampil untuk Blade Admin; kunci sama dengan formatRow controller sebelumnya.
      additionalProperties: true
      properties:
        id:
          type: integer
        id_user:
          type: integer
        id_kegiatan:
          type: integer
          nullable: true
        sumber:
          type: string
          enum: [mandiri, sebelumnya]
        kegiatan:
          type: string
        nama_lomba:
          type: string
        penyelenggara:
          type: string
        lokasi:
          type: string
        dosen:
          type: string
        tingkat:
          type: string
        capaian:
          type: string
        jenis:
          type: string
        kategori_form:
          type: string
        tanggal_mulai:
          type: string
        tanggal_selesai:
          type: string
        bentuk:
          type: string
          enum: [Individu, Tim]
        anggota_form:
          type: array
          items:
            type: object
            additionalProperties: true
        deskripsi:
          type: string
        dokumen:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              jenis:
                type: string
              nama:
                type: string
              url:
                type: string
        pemilik_prestasi:
          type: string
        anggota:
          type: array
          items:
            type: string

    AdminPrestasiRaw:
      type: object
      description: |
        Atribut Prestasi dan relasi yang diserialisasi dari model. Selain kunci di bawah,
        API dapat mengirim atribut/relasi tambahan dari model Eloquent.
      additionalProperties: true
      properties:
        id_prestasi:
          type: integer
          example: 9
        id_user:
          type: integer
        created_by:
          type: integer
          nullable: true
        id_kegiatan:
          type: integer
          nullable: true
        nama_lomba:
          type: string
        jenis_prestasi:
          type: string
        bidang_lomba:
          type: string
          nullable: true
        penyelenggara:
          type: string
        lokasi:
          type: string
        tingkat_kejuaraan:
          type: string
        capaian:
          type: string
        bentuk_partisipasi:
          type: string
        kegiatan:
          type: object
          nullable: true
          additionalProperties: true
        bukti_prestasi:
          type: array
          items:
            type: object
            additionalProperties: true
        tampilan:
          $ref: '#/components/schemas/AdminPrestasiTampilan'

    AdminPrestasiListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Daftar prestasi berhasil diambil
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminPrestasiRaw'
        meta:
          $ref: '#/components/schemas/Meta'

    AdminPrestasiDetailResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/AdminPrestasiRaw'

    AdminPrestasiKegiatanOpsi:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        nama:
          type: string
        penyelenggara:
          type: string
        lokasi:
          type: string
        dosenPembimbing:
          type: string
        tingkat:
          type: string
        tanggalMulai:
          type: string
          description: Tanggal YYYY-MM-DD atau string kosong.
        tanggalSelesai:
          type: string
          description: Tanggal YYYY-MM-DD atau string kosong.
        jenisPrestasi:
          type: string
        bidangPrestasi:
          type: string
        idPemilik:
          type: integer
        namaPemilik:
          type: string
        anggota:
          type: array
          items:
            type: object
            additionalProperties: true

    AdminPrestasiOpsiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
          properties:
            kegiatanOptions:
              type: array
              description: Objek kegiatan terserialisasi dengan relasi; diperlukan untuk kompatibilitas form.
              items:
                type: object
                additionalProperties: true
            kegiatanList:
              type: array
              items:
                $ref: '#/components/schemas/AdminPrestasiKegiatanOpsi'
            pemilikList:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  nama:
                    type: string
                  email:
                    type: string
            tingkatList:
              type: array
              items:
                type: string
            capaianList:
              type: array
              description: Saran capaian standar dan nilai historis; input manual tetap diperbolehkan.
              items:
                type: string
            saranIsian:
              type: object
              description: Pilihan autocomplete dari maksimal 300 prestasi terbaru; masing-masing maksimal 60 nilai unik.
              properties:
                nama_lomba:
                  type: array
                  items:
                    type: string
                penyelenggara:
                  type: array
                  items:
                    type: string
                lokasi:
                  type: array
                  items:
                    type: string
                dosen:
                  type: array
                  items:
                    type: string
                kategori:
                  type: array
                  items:
                    type: string
            jenisList:
              type: array
              items:
                type: string
            jenisDokList:
              type: array
              items:
                type: string
            daftarMahasiswa:
              type: array
              items:
                type: string
            anggotaOptions:
              type: array
              items:
                type: object
                additionalProperties: true
            peranList:
              type: array
              items:
                type: string
            jenisDokumenOptions:
              type: array
              items:
                type: object
                properties:
                  id_jenis_dokumen:
                    type: integer
                  nama_jenis_dokumen:
                    type: string

    AdminPrestasiAnggotaInput:
      type: object
      required: [id_user, nama, peran]
      properties:
        id_user:
          type: integer
        nama:
          type: string
          maxLength: 150
        peran:
          type: string
          enum: [Ketua, Anggota]

    AdminPrestasiDokumenInput:
      type: object
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            HTTPS berbagi Google Drive/Docs, OneDrive, atau subdomain SharePoint.
            Jika url terisi, jenis juga harus terisi.
          example: https://drive.google.com/file/d/123456789/view
        jenis:
          type: string
          enum: [Sertifikat, Dokumentasi kegiatan]

    AdminPrestasiRequest:
      type: object
      description: |
        Untuk sumber sebelumnya, kegiatan dan id_kegiatan wajib diisi;
        nilai kegiatan yang tersedia di server akan diterapkan ulang.
        Untuk sumber mandiri berbentuk Tim, anggota wajib minimal dua orang,
        termasuk pemilik prestasi dan tepat satu Ketua.
        Setelah menggabungkan dokumen baru dan dokumen_pertahankan, wajib ada
        setidaknya satu bukti dan maksimal lima; tautan tidak boleh duplikat.
        Pada pembaruan, hanya ID bukti milik prestasi tersebut yang boleh dipertahankan.
      required: [sumber, id_user, nama_lomba, penyelenggara, lokasi, tingkat, capaian, jenis, tanggal_mulai, tanggal_selesai, bentuk]
      properties:
        sumber:
          type: string
          enum: [mandiri, sebelumnya]
        id_user:
          type: integer
          description: Pengguna pemilik prestasi dengan role dosen atau mahasiswa.
